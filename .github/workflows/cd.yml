name: CD

# CI(ci.yml)가 main 또는 dev에서 성공적으로 끝난 직후에만 실행된다.
# push 이벤트로 직접 트리거하지 않는 이유: 테스트가 실패해도 배포가 진행되는 걸 막기 위함.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main, dev ]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: 체크아웃 (CI가 검증한 커밋 그대로)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 이미지 태그 결정 (브랜치명 + 커밋 SHA)
        id: meta
        run: |
          BRANCH_TAG=$(echo "${{ github.event.workflow_run.head_branch }}" | tr '/' '-')
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "tag=${BRANCH_TAG}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartsub-v2-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/smartsub-v2-backend:${{ steps.meta.outputs.branch_tag }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: EC2에 SSH로 접속해 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/smartsub-v2-backend

            git fetch origin
            git reset --hard origin/${{ github.event.workflow_run.head_branch }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export GHCR_OWNER=${{ github.repository_owner }}
            export APP_IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate app

            for i in {1..30}; do
              if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
                echo "smartsub-app is healthy"
                docker ps --filter "name=smartsub-app"
                docker image prune -f
                exit 0
              fi
              echo "Waiting for smartsub-app to become healthy... ($i/30)"
              sleep 3
            done

            echo "smartsub-app health check failed"
            docker logs --tail=100 smartsub-app
            exit 1
